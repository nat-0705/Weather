name: Daily Weather Ingestion

on:
  schedule:
    - cron: "0 22 * * *"   # runs 22:00 UTC = 6:00 AM Manila time
  workflow_dispatch:        # lets you trigger it manually too, for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas google-cloud-bigquery pyarrow pandas-gbq

      - name: Write credentials file
        run: echo '${{ secrets.GCP_SA_KEY }}' > credentials.json

      - name: Run ingestion script
        run: python ingest.py